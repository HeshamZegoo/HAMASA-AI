name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - "index.html"
      - "config.js"
      - "attachments.js"
      - "voice-mode.js"
      - "scripts/validate.py"
      - "sandbox-service/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - "index.html"
      - "config.js"
      - "attachments.js"
      - "scripts/validate.py"
      - "sandbox-service/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frontend and backend contract
        run: python scripts/validate.py
      - name: Check voice client JavaScript syntax
        run: node --check voice-mode.js

  sandbox-service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test isolated sandbox service
        run: npm install --no-audit --no-fund && npm test
        working-directory: sandbox-service

  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
