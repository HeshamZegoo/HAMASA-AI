<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<title>HAMASA AI — حماصة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031326">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://hamasa-api-production.up.railway.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
<style>
:root{--bg:#031326;--bg2:#07213f;--fg:#fff;--mut:rgba(255,255,255,.62);--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.1);--acc:#D100D1;--cy:#38d6ff;--sh:0 24px 60px rgba(0,0,0,.4);--d:1;--vh:100dvh;
--font:"Avenir Next","SF Pro Rounded","Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif}
[data-theme=light]{--bg:#f2f6fc;--bg2:#e3ecf9;--fg:#031326;--mut:rgba(3,19,38,.64);--glass:rgba(255,255,255,.72);--glass2:rgba(3,19,38,.06);--line:rgba(3,19,38,.1);--sh:0 20px 50px rgba(3,19,38,.12)}
[dir=rtl]{--d:-1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{position:fixed;inset:0;width:100%}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:10px}
.app{position:relative;display:flex;height:var(--vh);width:100%;overflow:hidden;
background:radial-gradient(900px 500px at 78% -10%,rgba(209,0,209,.18),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(56,214,255,.12),transparent 60%),var(--bg)}
.sb{width:288px;flex:none;display:flex;flex-direction:column;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-inline-end:1px solid var(--line);margin-inline-start:-288px;transition:margin .35s cubic-bezier(.3,.8,.2,1),transform .35s cubic-bezier(.3,.8,.2,1);z-index:30}
.open .sb{margin-inline-start:0}
.scrim{display:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em}
.brand svg{width:34px;height:34px}
.btn-new{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff;font-weight:600;box-shadow:0 10px 30px rgba(209,0,209,.35)}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.hist h3{font-size:12px;font-weight:600;color:var(--mut);padding:8px 8px 6px}
.hi{display:flex;align-items:center;border-radius:12px}
.hi:hover,.hi.on{background:var(--glass2)}
.hi .t{flex:1;min-width:0;text-align:start;padding:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.hi .x{opacity:.0;padding:8px;color:var(--mut)}.hi:hover .x,.hi:focus-within .x{opacity:1}
.none{color:var(--mut);font-size:14px;padding:8px}
.side-foot{display:flex}
.link{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;color:var(--mut);width:100%}
.link:hover{background:var(--glass2);color:var(--fg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));flex:none}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--glass);border:1px solid var(--line);flex:none;transition:background .2s}
.ib:hover{background:var(--glass2)}
.ib svg,.link svg,.btn-new svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo svg{width:38px;height:38px;flex:none}
.logo b{display:block;letter-spacing:.16em;font-size:15px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat i{width:7px;height:7px;border-radius:50%;background:#f5b942;box-shadow:0 0 10px #f5b942;flex:none}
.stat.live i{background:#34e0a1;box-shadow:0 0 10px #34e0a1}
 .lang{padding:0 14px;width:auto;font-weight:600;font-size:14px}.auth-open{width:auto;padding:0 14px;font-size:13px;font-weight:700;white-space:nowrap}
.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.empty .orb{width:min(46vw,200px,calc(var(--vh)*.25))}
.empty h1{font-size:clamp(26px,6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.empty p{color:var(--mut);max-width:420px;line-height:1.55}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:560px;margin-top:8px}
.chip{padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:start;font-size:14px;line-height:1.4;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s,border-color .2s}
.chip:hover{border-color:var(--acc);transform:translateY(-2px)}
.m{display:flex;max-width:100%}
.m.user{justify-content:flex-end}
.bub{max-width:min(86%,620px);padding:12px 16px;border-radius:20px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.user .bub{background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff;border-end-end-radius:6px;box-shadow:0 10px 28px rgba(209,0,209,.28)}
.bot .bub{background:var(--glass);border:1px solid var(--line);border-end-start-radius:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.msg-content{width:fit-content;max-width:min(86%,620px);min-width:0}.msg-content .bub{max-width:100%}
.msg-tools{display:flex;gap:7px;margin:6px 2px 0;flex-wrap:wrap}
.msg-tool{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--glass);color:var(--mut);font-size:12px;line-height:1.2}
.msg-tool:hover,.msg-tool[aria-pressed=true]{background:var(--glass2);color:var(--fg);border-color:var(--cy)}
.msg-tool svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.tag{display:inline-block;margin-top:8px;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:normal}
.err .bub{border-color:rgba(255,110,130,.5)}
.err b{display:block;margin-bottom:4px}
.rt{margin-top:10px;padding:8px 14px;border-radius:10px;background:var(--glass2);font-weight:600}
.dots{display:flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.comp{flex:none;padding:8px calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;padding:8px;border-radius:26px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .25s,box-shadow .25s}
.box:focus-within{border-color:rgba(209,0,209,.7);box-shadow:var(--sh),0 0 0 4px rgba(209,0,209,.14)}
.box textarea{flex:1;min-width:0;resize:none;background:none;border:0;outline:0;font-size:16px;line-height:1.5;padding:9px 6px;max-height:160px;height:42px}
.box textarea::placeholder{color:var(--mut)}
.cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mut)}
.cb:hover{background:var(--glass2);color:var(--fg)}
.cb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.send{background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff;box-shadow:0 8px 22px rgba(209,0,209,.4)}
.send:hover{color:#fff;background:linear-gradient(135deg,var(--acc),#6a1bd6)}
.send:disabled{opacity:.35;box-shadow:none}
[dir=rtl] .send svg{transform:scaleX(-1)}
/* ORB */
.orb{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 22px rgba(209,0,209,.5)) drop-shadow(0 0 40px rgba(56,214,255,.22))}
.orb .body,.orb .face,.orb .eye,.orb .mouth{transform-box:fill-box;transform-origin:center}
.orb .body{animation:breathe 5s ease-in-out infinite}
.orb .eye{animation:blink 5.2s infinite}
.orb .halo{transform-origin:100px 100px;opacity:.7}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes look{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
to{transform:scaleY(1.9)}}
@keyframes ping{50%{opacity:1;transform:scale(1.06)}}
.orb.thinking .halo{animation:spin 2.4s linear infinite;opacity:1}
.orb.thinking .face{animation:look 1.8s ease-in-out infinite}
.orb.listening .body{animation:breathe 1.5s ease-in-out infinite}
.orb.listening .halo{animation:ping 1.5s ease-in-out infinite}
.orb.listening .face{transform:scale(1.08)}
/* SETTINGS */
dialog{margin:auto;width:min(440px,calc(100vw - 28px));max-height:calc(var(--vh) - 28px);overflow-y:auto;border:1px solid var(--line);border-radius:24px;padding:22px;color:var(--fg);background:var(--bg2);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(1,8,18,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog h2{font-size:20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.memory-box{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.memory-box h3{font-size:15px;margin-bottom:6px}
.memory-help{font-size:12px;line-height:1.5;color:var(--mut);margin-bottom:12px}
.memory-box select,.memory-box textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--glass2);color:var(--fg);font:inherit;margin-bottom:8px}
.memory-box textarea{min-height:76px;resize:vertical}
.memory-add{width:100%;padding:11px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#6a1bd6);color:white;font-weight:700}
.memory-list{display:grid;gap:8px;margin-top:12px;max-height:190px;overflow:auto}
.memory-item{display:flex;align-items:flex-start;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--glass2)}
.memory-item>div{min-width:0;flex:1}
.memory-item small{display:block;color:var(--mut);font-size:11px;margin-bottom:3px}
.memory-item p{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.memory-item button{color:#ff7a90;padding:2px 6px;font-size:18px;line-height:1}
.row{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.row>span{font-size:13px;color:var(--mut)}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--glass2);gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff}
.note{font-size:13px;line-height:1.5;color:var(--mut);padding:12px;border-radius:12px;background:var(--glass2)}
.danger{color:#ff7a90;padding:10px 0;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--sh);font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:80;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1023px){
.sb{position:fixed;top:0;bottom:0;inset-inline-start:0;margin:0;width:min(300px,84vw);transform:translateX(calc(-105% * var(--d)))}
.open .sb{transform:none}
.scrim{display:block;position:fixed;inset:0;background:rgba(1,8,18,.55);opacity:0;visibility:hidden;transition:.3s;z-index:20}
.open .scrim{opacity:1;visibility:visible}}
@media (max-width:420px){.chips{grid-template-columns:1fr}.stat{display:none}.logo b{font-size:14px}header{gap:6px}.ib{width:40px;height:40px}.lang{padding:0 10px}}
@media (max-height:520px){.empty .orb{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* HAMASA MONOCHROME / 3D ROBOT EXPERIENCE */
:root{
  --bg:#f7f7f7;--bg2:#fff;--fg:#101010;--mut:rgba(16,16,16,.58);
  --glass:rgba(255,255,255,.78);--glass2:rgba(0,0,0,.055);--line:rgba(0,0,0,.11);
  --acc:#111;--cy:#555;--sh:0 24px 70px rgba(0,0,0,.09);
}
[data-theme=light]{
  --bg:#f7f7f7;--bg2:#fff;--fg:#101010;--mut:rgba(16,16,16,.58);
  --glass:rgba(255,255,255,.78);--glass2:rgba(0,0,0,.055);--line:rgba(0,0,0,.11);
  --sh:0 24px 70px rgba(0,0,0,.09);
}
[data-theme=dark]{
  --bg:#080808;--bg2:#111;--fg:#f7f7f7;--mut:rgba(255,255,255,.58);
  --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);
  --sh:0 24px 70px rgba(0,0,0,.42);
}
.app{
  background:
    radial-gradient(ellipse at 50% 36%,rgba(0,0,0,.045),transparent 42%),
    linear-gradient(135deg,rgba(0,0,0,.018) 0 1px,transparent 1px 50%),
    var(--bg);
  background-size:auto,34px 34px,auto;
}
[data-theme=dark] .app{background:radial-gradient(ellipse at 50% 36%,rgba(255,255,255,.055),transparent 42%),var(--bg)}
header{border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.logo b,.brand{letter-spacing:.2em}
.logo svg,.brand svg{filter:grayscale(1)}
.ib{background:var(--glass);border-color:var(--line);transition:transform .22s,background .22s,border-color .22s}
.ib:hover{transform:translateY(-2px);background:var(--glass2);border-color:var(--fg)}
.btn-new,.send,.user .bub,.seg button[aria-pressed=true],.memory-add{
  background:#111!important;color:#fff!important;box-shadow:0 9px 24px rgba(0,0,0,.16)!important
}
[data-theme=dark] .btn-new,[data-theme=dark] .send,[data-theme=dark] .user .bub,[data-theme=dark] .seg button[aria-pressed=true],[data-theme=dark] .memory-add{background:#f4f4f4!important;color:#080808!important}
.chip{background:var(--glass);border-color:var(--line);box-shadow:0 8px 26px rgba(0,0,0,.035);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.chip:hover{border-color:var(--fg);box-shadow:0 14px 34px rgba(0,0,0,.09);transform:translateY(-4px)}
.box{border-color:var(--line);background:var(--glass);box-shadow:0 18px 55px rgba(0,0,0,.09)}
.box:focus-within{border-color:var(--fg);box-shadow:0 18px 55px rgba(0,0,0,.1),0 0 0 4px rgba(0,0,0,.045)}
.bot .bub{background:var(--glass);border-color:var(--line)}
.user .bub{background:#111;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.12)}
[data-theme=dark] .user .bub{background:#f2f2f2;color:#111}
.dots i{background:var(--fg)}
.stat i{background:#555;box-shadow:0 0 9px rgba(0,0,0,.22)}
[data-theme=dark] .stat i{background:#eee;box-shadow:0 0 9px rgba(255,255,255,.4)}
.sb{background:var(--glass);border-color:var(--line)}
dialog{background:var(--bg2)}
.logo [data-orb],.brand [data-orb]{display:block;flex:none;width:40px;height:40px;overflow:visible}
.logo [data-orb] .robot-stage{width:40px;min-width:40px;margin:0;filter:none}
.brand [data-orb]{width:32px;height:32px}
.brand [data-orb] .robot-stage{width:32px;min-width:32px;margin:0;filter:none}
.logo [data-orb] .robot-orbit,.brand [data-orb] .robot-orbit,
.logo [data-orb] .robot-aura,.brand [data-orb] .robot-aura,
.logo [data-orb] .robot-shadow,.brand [data-orb] .robot-shadow,
.logo [data-orb] .robot-floor,.brand [data-orb] .robot-floor{display:none}
.logo [data-orb] .robot-3d,.brand [data-orb] .robot-3d{width:88%;height:88%}
/* Animated layered robot: CSS 3D, no external model or dependency */
.robot-stage{
  position:relative;width:min(58vw,270px,calc(var(--vh)*.34));aspect-ratio:1;
  display:grid;place-items:center;perspective:900px;isolation:isolate;margin:0 auto 4px;
  filter:drop-shadow(0 22px 24px rgba(0,0,0,.12));
}
.robot-aura{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.10),transparent 68%);filter:blur(14px);animation:auraPulse 4s ease-in-out infinite}
.robot-orbit{position:absolute;width:96%;height:34%;border:1px solid rgba(0,0,0,.16);border-radius:50%;transform:rotateX(68deg) rotateZ(-18deg);animation:orbitFloat 12s linear infinite}
[data-theme=dark] .robot-orbit{border-color:rgba(255,255,255,.24)}
.robot-orbit:before,.robot-orbit:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--fg);box-shadow:0 0 12px var(--fg)}
.robot-orbit:before{top:10%;left:15%}.robot-orbit:after{right:12%;bottom:12%;width:4px;height:4px}
.robot-shadow{position:absolute;bottom:5%;width:48%;height:10%;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(11px);animation:shadowPulse 4s ease-in-out infinite}
.robot-3d{
  position:relative;width:76%;height:82%;transform-style:preserve-3d;
  animation:robotFloat 4s ease-in-out infinite;transform:rotateY(-13deg) rotateX(5deg);
}
.robot-head{
  position:absolute;z-index:4;top:10%;left:17%;width:66%;height:48%;
  border-radius:34% 34% 29% 29%;border:1px solid #d9d9d9;
  background:linear-gradient(145deg,#fff 0%,#f5f5f5 27%,#bdbdbd 55%,#fafafa 73%,#777 100%);
  box-shadow:inset 5px 5px 12px rgba(255,255,255,.95),inset -8px -9px 15px rgba(0,0,0,.24),8px 12px 18px rgba(0,0,0,.18);
  transform:translateZ(18px);animation:headTilt 7s ease-in-out infinite;
}
[data-theme=dark] .robot-head{background:linear-gradient(145deg,#555,#202020 45%,#090909 70%,#444);border-color:#555;box-shadow:inset 5px 5px 12px rgba(255,255,255,.18),inset -8px -9px 15px rgba(0,0,0,.8),8px 12px 18px rgba(0,0,0,.5)}
.robot-highlight{position:absolute;top:5%;left:14%;width:38%;height:19%;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(7px);transform:rotate(-28deg)}
.robot-antenna{position:absolute;top:0;left:48%;height:13%;width:4px;border-radius:9px;background:linear-gradient(#777,#eee);transform:translateZ(12px)}
.robot-antenna i{position:absolute;top:-7px;left:-4px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#777 70%);box-shadow:0 0 12px rgba(0,0,0,.3);animation:antennaBlink 2.8s infinite}
.robot-ear{position:absolute;top:35%;width:12%;height:30%;border-radius:9px;background:linear-gradient(90deg,#777,#eee,#888);box-shadow:0 3px 6px rgba(0,0,0,.2)}
.robot-ear-left{left:-8%}.robot-ear-right{right:-8%}
.robot-face{
  position:absolute;inset:27% 11% 22%;border-radius:24px;
  background:linear-gradient(145deg,#111,#292929 55%,#050505);
  box-shadow:inset 0 3px 9px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;gap:19%;overflow:hidden;
}
.robot-eye{width:10%;height:24%;border-radius:99px;background:#fff;box-shadow:0 0 9px rgba(255,255,255,.8),0 0 18px rgba(255,255,255,.35);animation:robotBlink 5.2s infinite}
.robot-eye:nth-child(2){animation-delay:.08s}

    });

async function chatAdapter(messages) {
  const basePayload = buildChatRequest(messages);

    ? await window.HAMASA_ATTACHMENTS.addToPayload(basePayload)
    : basePayload;
  const response = await apiFetch(HAMASA_CONFIG.chatUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    signal: AbortSignal.timeout ? AbortSignal.timeout(95000) : undefined

  if (!response.ok) {

function speechCleanText(value) {
  let text = String(value || '');
  // Keep readable content, but remove Markdown decoration, links' URLs and emoji.
  text = text.replace(/\`{1,3}/g, '').replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '$1')
    .replace(/https?:\/\/\S+/gi, ' ')
    .replace(/^\s{0,3}(?:#{1,6}|>|[-*+]\s|\d+\.\s)/gm, '')
    .replace(/[*_~]{1,3}/g, ' ');
  try {
    text = text.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, ' ')
      .replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu, ' ')
      .replace(/[\u{1F3FB}-\u{1F3FF}]/gu, ' ');
  } catch {
    text = text.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, ' ');
  }
  return text.replace(/[\t ]+/g, ' ').replace(/ *\n */g, '. ')
    .replace(/([.!?؟،؛])\s*([.!?؟،؛])+/g, '$1').trim();
}
async function readMessageAloud(text, button) {
  if (activeSpeechButton === button && activeSpeech) {
    // If Safari blocked the first automatic play attempt, a second tap retries
    // the already-generated audio without calling the phone's speech engine.
    if (activeSpeech.paused) {
      try { await activeSpeech.play(); }
      catch { toast('اضغط مرة تانية لتشغيل الصوت.'); }
    } else stopReading();
    return;
  }
  if (activeSpeechButton === button && !activeSpeech) { stopReading(); return; }
  stopReading();
  const spokenText = speechCleanText(text);
  if (!spokenText) { toast(lang === 'ar' ? 'مفيش نص واضح للنطق.' : 'There is no readable text.'); return; }

  activeSpeechButton = button;
  button.setAttribute('aria-pressed', 'true');
  button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>' + t('stopReading') + '</span>';
  try {
    const response = await apiFetch(API_BASE + '/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: spokenText, gender: voiceGender }),
      signal: AbortSignal.timeout ? AbortSignal.timeout(90000) : undefined
    });
    if (!response.ok) {
      let detail = 'تعذر إنشاء الصوت.';
      try { detail = (await response.json()).detail || detail; } catch {}
      throw new Error(detail);
    }
    const data = await response.json();
    if (!data.audio) throw new Error('خدمة الصوت رجّعت ملف صوت فارغ.');
    if (activeSpeechButton !== button) return;
    const binary = atob(data.audio);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: data.mime_type || 'audio/wav' });
    activeSpeechUrl = URL.createObjectURL(blob);
    const audio = new Audio(activeSpeechUrl);
    activeSpeech = audio;
    audio.onended = () => { if (activeSpeech === audio) stopReading(); };
    audio.onerror = () => {
      if (activeSpeech === audio) {
        stopReading();
        toast('حصلت مشكلة أثناء تشغيل الصوت.');
      }
    };
    try {
      await audio.play();
    } catch (error) {
      // Keep the generated audio ready; the next tap is a direct play gesture.
      console.warn('Audio playback needs another tap:', error);
      toast('الصوت جاهز. دوس تاني على تشغيل الصوت.');
    }
  } catch (error) {
    if (activeSpeechButton === button) stopReading();
    console.error('HAMASA TTS failed:', error);
    toast(error.message || 'تعذر تشغيل الصوت حالياً.');
  }
}

    messages: cur.messages.slice(-20).map(m => ({
      role: m.role === 'bot' ? 'assistant' : 'user',
      content: m.text
    }))
  };
  const payload = window.HAMASA_ATTACHMENTS
    ? await window.HAMASA_ATTACHMENTS.addToPayload(fileRequest)
    : fileRequest;
  const response = await apiFetch(API_BASE + '/api/files/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    signal: AbortSignal.timeout ? AbortSignal.timeout(130000) : undefined
  });
  if (!response.ok) {
    let detail = 'تعذر إنشاء الملف (' + response.status + ').';
    try { detail = (await response.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return response.json();
}
function addFileDownload(target, file) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob(
    [Uint8Array.from(atob(file.data), c => c.charCodeAt(0))],
    { type: file.mime_type }
  ));
  link.download = file.filename;
  link.textContent = '⬇ تنزيل ' + file.filename;
  link.style.cssText = 'display:inline-flex;margin-top:12px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#6a1bd6);color:white;text-decoration:none;font-weight:600';
  link.addEventListener('click', () => setTimeout(() => URL.revokeObjectURL(link.href), 60000), { once: true });
  target.append(link);
}
async function respond() {
  setBusy(true); typing();
  try {
    const generated = await generateRequestedFile();
    if (generated) {
      window.HAMASA_ATTACHMENTS?.clear();
      $('#typing')?.remove();
      const m = { role: 'bot', text: generated.message || 'جهزتلك الملف.' };
      cur.messages.push(m);
      const row = bubble(m);
      addFileDownload(row.querySelector('.bub'), generated);
      msgs.append(row); save(); scrollEnd(); setBusy(false); return m.text;
    }
    const r = await chatAdapter(cur.messages);
    $('#typing')?.remove(); const m = { role: 'bot', text: r.text, demo: r.demo }; cur.messages.push(m); msgs.append(bubble(m)); save();
    scrollEnd(); setBusy(false); return r.text;
  } catch (e) { console.error(e); $('#typing')?.remove(); errorRow(e); setBusy(false); return null; }
}
async function send(text) {
  text = (text || '').trim(); if (!text || busy) return;
  if (!cur) { cur = { id: crypto.randomUUID(), updated_at: Date.now(), title: text.slice(0, 40), messages: [] }; convs.unshift(cur); }
  $('#empty').style.display = 'none';
  const m = { role: 'user', text }; cur.messages.push(m); msgs.append(bubble(m)); save(); renderHist();
  inp.value = ''; grow(); return respond();
}
function grow() { inp.style.height = '42px'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; sendBtn.disabled = busy || !inp.value.trim(); }
inp.addEventListener('input', grow);
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(inp.value); } });
sendBtn.onclick = () => { send(inp.value); inp.focus({ preventScroll: true }); };
// File picker and upload are initialized by attachments.js.
inp.addEventListener('focus', () => setTimeout(() => { fit(); scrollEnd(); }, 300));


/* Account authentication: passwords are sent only over HTTPS and stored as salted PBKDF2 hashes on the API. */
// Keep the signed-in session across browser/app restarts. The API token is
// scoped to this site, expires server-side, and is revoked on explicit sign-out.
let authToken = store.get("hamasa.authToken", "") || sessionStorage.getItem("hamasa.authToken") || "";
if (authToken) {
  store.set("hamasa.authToken", authToken);
  try { sessionStorage.removeItem("hamasa.authToken"); } catch {}
}
function saveAuthToken(value) {
  authToken = value || "";
  try {
    if (authToken) store.set("hamasa.authToken", authToken);
    else localStorage.removeItem("hamasa.authToken");
    sessionStorage.removeItem("hamasa.authToken");
  } catch {}
}
let authUser = store.get("hamasa.authUser", null);
let authMode = "login";
function updateAuthButton() {
  const b = $("#authOpen");
  if (!b) return;
  b.textContent = authUser?.email ? authUser.email.split("@")[0] : (lang === "ar" ? "تسجيل الدخول" : "Sign in");
  b.title = authUser?.email || "";
  $("#authSignout").hidden = !authUser;
  $("#authSwitch").hidden = !!authUser;
  $("#authForm").hidden = !!authUser;
  $("#authHint").textContent = authUser
    ? (lang === "ar" ? "أنت مسجل الدخول. ذاكرتك المحفوظة مرتبطة بحسابك." : "You are signed in. Your saved memories are linked to your account.")
    : (lang === "ar" ? "سجّل دخولك لمزامنة ذاكرتك المحفوظة مع حسابك." : "Sign in to keep your saved memories linked to your account.");
  if (authUser) $("#authTitle").textContent = lang === "ar" ? "الحساب" : "Your account";
}
function setAuthMode(mode) {
  authMode = mode;
  const ar = lang === "ar";
  $("#authTitle").textContent = mode === "signup" ? (ar ? "إنشاء حساب" : "Create account") : (ar ? "تسجيل الدخول" : "Sign in");
  $("#authSubmit").textContent = mode === "signup" ? (ar ? "إنشاء الحساب" : "Create account") : (ar ? "دخول" : "Sign in");
  $("#authSwitch").textContent = mode === "signup" ? (ar ? "عندك حساب؟ سجّل دخولك" : "Already have an account? Sign in") : (ar ? "مستخدم جديد؟ أنشئ حساب" : "New here? Create an account");
  $("#authPassword").autocomplete = mode === "signup" ? "new-password" : "current-password";
  $("#authPassword").minLength = 10;
  $("#authPassword").required = true;
  $("#authEmail").disabled = false;
  $("#authPasswordRow").hidden = false;
}
$("#authOpen").onclick = () => { updateAuthButton(); setAuthMode(authUser ? "login" : "login"); $("#authDlg").showModal(); };
$("#authClose").onclick = () => $("#authDlg").close();
$("#authSwitch").onclick = () => setAuthMode(authMode === "login" ? "signup" : "login");
$("#authSignout").onclick = () => {
  apiFetch(API_BASE + "/api/auth/logout", { method: "POST" }).catch(() => {});
  saveAuthToken(""); authUser = null; cloudHistoryReady = false; store.set("hamasa.authUser", null);
  updateAuthButton(); $("#authDlg").close(); toast(lang === "ar" ? "تم تسجيل الخروج" : "Signed out");
};
$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const submit = $("#authSubmit"); submit.disabled = true;
  const email = $("#authEmail").value.trim();
  try {
    const endpoint = authMode === "signup" ? "/api/auth/signup" : "/api/auth/login";
    const response = await apiFetch(API_BASE + endpoint, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: $("#authPassword").value })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || (lang === "ar" ? "تعذر تسجيل الدخول." : "Authentication failed."));
    saveAuthToken(data.token); authUser = data.user;
    store.set("hamasa.authUser", authUser);
    $("#authPassword").value = "";
    updateAuthButton();
    $("#authDlg").close();
    try {
      await syncMemoriesFromServer();
      await syncConversationsFromServer();
      toast(lang === "ar"
        ? (authMode === "signup" ? "حسابك اتعمل بنجاح!" : "أهلاً بيك! محادثاتك اتزامنت.")
        : (authMode === "signup" ? "Your account was created!" : "You’re signed in and your chats are synced."));
    } catch (syncError) {
      console.warn("Signed in, but cloud chat synchronization is temporarily unavailable.", syncError);
      toast(lang === "ar"
        ? "تم تسجيل الدخول، لكن تعذرت مزامنة المحادثات مؤقتاً. محادثاتك المحلية لسه موجودة."
        : "You’re signed in, but chat sync is temporarily unavailable. Your local chats are still here.");
    }
  } catch (error) {
    toast(error.message || (lang === "ar" ? "حصل خطأ." : "Something went wrong."));
  } finally { submit.disabled = false; }
});
async function validateSavedSession() {
  if (!authToken) {
    authUser = null; cloudHistoryReady = false; store.set("hamasa.authUser", null);
    updateAuthButton();
    return;
  }
  try {
    const response = await apiFetch(API_BASE + "/api/auth/me", { cache: "no-store" });
    if (response.status === 401) {
      saveAuthToken(""); authUser = null; cloudHistoryReady = false;
      store.set("hamasa.authUser", null); updateAuthButton();
      return;
    }
    if (!response.ok) {
      // Keep the saved token through temporary outages or server-side configuration errors.
      console.warn("Session validation is temporarily unavailable:", response.status);
      updateAuthButton();
      return;
    }
    const data = await response.json(); authUser = data.user; store.set("hamasa.authUser", authUser);
    updateAuthButton();
  } catch (error) {
    // A network failure is not proof that the user's session expired.
    console.warn("Could not validate the saved session; keeping it for the next retry.", error);
    updateAuthButton();
  }
}

mountOrbs(); applyTheme(); applyLang(); renderChat(); checkBackend();
validateSavedSession().then(async () => {
  if (authUser) {
    await syncMemoriesFromServer();
    try { await syncConversationsFromServer(); }
    catch (error) { console.warn("Cloud chat history could not be loaded.", error); toast(lang === "ar" ? "تعذر تحميل محادثات الحساب." : "Could not load account chats."); }
  }
});

// Recover automatically if the backend is temporarily unavailable during page load.
let backendReconnectBusy = false;
setInterval(async () => {
  if (backendReconnectBusy) return;
  backendReconnectBusy = true;
  try {
    const wasOnline = backendOnline;
    await checkBackend();
    if (!wasOnline && backendOnline && authToken) {
      await validateSavedSession();
      if (authUser) {
        await syncMemoriesFromServer();
        try { await syncConversationsFromServer(); }
        catch (error) {
          console.warn("Cloud chat history is still unavailable after reconnect.", error);
        }
      }
    }
  } finally {
    backendReconnectBusy = false;
  }
}, 30000);
