<style>
:root{--bg:#031326;--bg2:#07213f;--fg:#fff;--mut:rgba(255,255,255,.62);--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.1);--acc:#D100D1;--cy:#38d6ff;--sh:0 24px 60px rgba(0,0,0,.4);--d:1;--vh:100dvh;
--font:"Avenir Next","SF Pro Rounded","Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif}
[data-theme=light]{--bg:#f2f6fc;--bg2:#e3ecf9;--fg:#031326;--mut:rgba(3,19,38,.64);--glass:rgba(255,255,255,.72);--glass2:rgba(3,19,38,.06);--line:rgba(3,19,38,.1);--sh:0 20px 50px rgba(3,19,38,.12)}
[dir=rtl]{--d:-1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{position:fixed;inset:0;width:100%}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:10px}
.app{position:relative;display:flex;height:var(--vh);width:100%;overflow:hidden;
background:radial-gradient(900px 500px at 78% -10%,rgba(209,0,209,.18),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(56,214,255,.12),transparent 60%),var(--bg)}
.sb{width:288px;flex:none;display:flex;flex-direction:column;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-inline-end:1px solid var(--line);margin-inline-start:-288px;transition:margin .35s cubic-bezier(.3,.8,.2,1),transform .35s cubic-bezier(.3,.8,.2,1);z-index:30}
.open .sb{margin-inline-start:0}
.scrim{display:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em}
.brand svg{width:34px;height:34px}
.btn-new{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff;font-weight:600;box-shadow:0 10px 30px rgba(209,0,209,.35)}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.hist h3{font-size:12px;font-weight:600;color:var(--mut);padding:8px 8px 6px}
.hi{display:flex;align-items:center;border-radius:12px}
.hi:hover,.hi.on{background:var(--glass2)}
.hi .t{flex:1;min-width:0;text-align:start;padding:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.hi .x{opacity:.0;padding:8px;color:var(--mut)}.hi:hover .x,.hi:focus-within .x{opacity:1}
.none{color:var(--mut);font-size:14px;padding:8px}
.side-foot{display:flex}
.link{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;color:var(--mut);width:100%}
.link:hover{background:var(--glass2);color:var(--fg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));flex:none}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--glass);border:1px solid var(--line);flex:none;transition:background .2s}
.ib:hover{background:var(--glass2)}
.ib svg,.link svg,.btn-new svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo svg{width:38px;height:38px;flex:none}
.logo b{display:block;letter-spacing:.16em;font-size:15px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat i{width:7px;height:7px;border-radius:50%;background:#f5b942;box-shadow:0 0 10px #f5b942;flex:none}
.stat.live i{background:#34e0a1;box-shadow:0 0 10px #34e0a1}
.lang{padding:0 14px;width:auto;font-weight:600;font-size:14px}
.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.empty .orb{width:min(46vw,200px,calc(var(--vh)*.25))}
.empty h1{font-size:clamp(26px,6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.empty p{color:var(--mut);max-width:420px;line-height:1.55}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:560px;margin-top:8px}
.chip{padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:start;font-size:14px;line-height:1.4;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s,border-color .2s}
.chip:hover{border-color:var(--acc);transform:translateY(-2px)}
.m{display:flex;max-width:100%}
.m.user{justify-content:flex-end}
.bub{max-width:min(86%,620px);padding:12px 16px;border-radius:20px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.user .bub{background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff;border-end-end-radius:6px;box-shadow:0 10px 28px rgba(209,0,209,.28)}
.bot .bub{background:var(--glass);border:1px solid var(--line);border-end-start-radius:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tag{display:inline-block;margin-top:8px;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:normal}
.err .bub{border-color:rgba(255,110,130,.5)}
.err b{display:block;margin-bottom:4px}
.rt{margin-top:10px;padding:8px 14px;border-radius:10px;background:var(--glass2);font-weight:600}
.dots{display:flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.comp{flex:none;padding:8px calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;padding:8px;border-radius:26px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .25s,box-shadow .25s}
.box:focus-within{border-color:rgba(209,0,209,.7);box-shadow:var(--sh),0 0 0 4px rgba(209,0,209,.14)}
.box textarea{flex:1;min-width:0;resize:none;background:none;border:0;outline:0;font-size:16px;line-height:1.5;padding:9px 6px;max-height:160px;height:42px}
.box textarea::placeholder{color:var(--mut)}
.cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mut)}
.cb:hover{background:var(--glass2);color:var(--fg)}
.cb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.send{background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff;box-shadow:0 8px 22px rgba(209,0,209,.4)}
.send:hover{color:#fff;background:linear-gradient(135deg,var(--acc),#6a1bd6)}
.send:disabled{opacity:.35;box-shadow:none}
[dir=rtl] .send svg{transform:scaleX(-1)}
/* ORB */
.orb{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 22px rgba(209,0,209,.5)) drop-shadow(0 0 40px rgba(56,214,255,.22))}
.orb .body,.orb .face,.orb .eye,.orb .mouth{transform-box:fill-box;transform-origin:center}
.orb .body{animation:breathe 5s ease-in-out infinite}
.orb .eye{animation:blink 5.2s infinite}
.orb .halo{transform-origin:100px 100px;opacity:.7}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes look{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(1.9)}}
@keyframes ping{50%{opacity:1;transform:scale(1.06)}}
.orb.thinking .halo{animation:spin 2.4s linear infinite;opacity:1}
.orb.thinking .face{animation:look 1.8s ease-in-out infinite}
.orb.speaking .mouth{animation:talk .32s ease-in-out infinite alternate}
.orb.listening .body{animation:breathe 1.5s ease-in-out infinite}
.orb.listening .halo{animation:ping 1.5s ease-in-out infinite}
.orb.listening .face{transform:scale(1.08)}
/* VOICE */
.voice{position:fixed;left:0;right:0;top:0;height:var(--vh);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));background:radial-gradient(600px 420px at 50% 40%,rgba(209,0,209,.25),transparent 70%),radial-gradient(500px 400px at 50% 100%,rgba(56,214,255,.16),transparent 70%),var(--bg);opacity:0;visibility:hidden;transform:scale(1.03);transition:opacity .4s,transform .4s,visibility .4s;overflow:hidden}
.voice.on{opacity:1;visibility:visible;transform:none}
.vtop{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.vmid{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,26px);text-align:center}
.vmid .orb{width:min(70vw,calc(var(--vh)*.34),340px)}
.vst{font-size:clamp(20px,4.6vw,28px);font-weight:700}
.vcap{color:var(--mut);max-width:520px;line-height:1.5;max-height:5.6em;overflow-y:auto;padding:0 6px;font-size:15px}
.mic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff;box-shadow:0 0 0 0 rgba(209,0,209,.5),0 14px 40px rgba(209,0,209,.45);flex:none}
.mic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mic.rec{animation:ring 1.4s infinite}
@keyframes ring{to{box-shadow:0 0 0 26px rgba(209,0,209,0),0 14px 40px rgba(209,0,209,.45)}}
.vhint{font-size:13px;color:var(--mut);margin-top:10px;text-align:center}
/* SETTINGS */
dialog{margin:auto;width:min(440px,calc(100vw - 28px));max-height:calc(var(--vh) - 28px);overflow-y:auto;border:1px solid var(--line);border-radius:24px;padding:22px;color:var(--fg);background:var(--bg2);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(1,8,18,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog h2{font-size:20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.row>span{font-size:13px;color:var(--mut)}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--glass2);gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--acc),#6a1bd6);color:#fff}
.note{font-size:13px;line-height:1.5;color:var(--mut);padding:12px;border-radius:12px;background:var(--glass2)}
.danger{color:#ff7a90;padding:10px 0;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--sh);font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:80;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1023px){
.sb{position:fixed;top:0;bottom:0;inset-inline-start:0;margin:0;width:min(300px,84vw);transform:translateX(calc(-105% * var(--d)))}
.open .sb{transform:none}
.scrim{display:block;position:fixed;inset:0;background:rgba(1,8,18,.55);opacity:0;visibility:hidden;transition:.3s;z-index:20}
.open .scrim{opacity:1;visibility:visible}}
@media (max-width:420px){.chips{grid-template-columns:1fr}.stat{display:none}.logo b{font-size:14px}header{gap:6px}.ib{width:40px;height:40px}.lang{padding:0 10px}}
@media (max-height:520px){.empty .orb{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   1. API ADAPTERS — the only place that talks to a backend.
   TODO: Wire these to the EXISTING HAMASA AI endpoints. Chat is served by the
   NVIDIA provider and voice by the Gemini provider, both behind your server.
   Never put API keys in this file; keep them server-side.
   ===================================================================== */
const API_BASE = "https://hamasa-api-production.up.railway.app";
const HAMASA_CONFIG = {
  chatUrl: API_BASE + "/api/chat",
  voiceUrl: API_BASE + "/api/live"
};
let backendOnline = false;
const isConnected = () => backendOnline;

function buildChatRequest(messages) {
  return {
    messages: messages.map(m => ({
      role: m.role === "bot" ? "assistant" : m.role,
      content: m.text
    }))
  };
}
function parseChatResponse(json) {
  if (json && typeof json.reply === "string" && json.reply.trim()) return json.reply.trim();
  throw new Error("The chat service returned an unexpected response.");
}
async function checkBackend() {
  try {
    const response = await fetch(API_BASE + "/health", { cache: "no-store" });
    const data = await response.json();
    backendOnline = response.ok && data.status === "ok" && data.provider_configured === true;
  } catch {
    backendOnline = false;
  }
  updStatus();
}
async function chatAdapter(messages) {
  const response = await fetch(HAMASA_CONFIG.chatUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(buildChatRequest(messages)),
    signal: AbortSignal.timeout ? AbortSignal.timeout(95000) : undefined
  });
  if (!response.ok) {
    let detail = "HTTP " + response.status;
    try { detail = (await response.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return { text: parseChatResponse(await response.json()), demo: false };
}

/* Gemini Live audio is proxied by the existing FastAPI backend. No provider key is
   exposed to this page. */

/* =====================================================================
   2. I18N
   ===================================================================== */

function downsampleTo16k(float32, inputRate) {
  if (inputRate === 16000) return float32;
  const ratio = inputRate / 16000;
  const length = Math.floor(float32.length / ratio);
  const result = new Float32Array(length);
  for (let i = 0; i < length; i++) {
    const start = Math.floor(i * ratio), end = Math.floor((i + 1) * ratio);
    let sum = 0, count = 0;
    for (let j = start; j < end && j < float32.length; j++) { sum += float32[j]; count++; }
    result[i] = count ? sum / count : 0;
  }
  return result;
}
function pcmBase64(float32) {
  const bytes = new ArrayBuffer(float32.length * 2);
  const view = new DataView(bytes);
  for (let i = 0; i < float32.length; i++) {
    const sample = Math.max(-1, Math.min(1, float32[i]));
    view.setInt16(i * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
  }
  let binary = '';
  const chunk = new Uint8Array(bytes);
  for (let i = 0; i < chunk.length; i += 0x8000) binary += String.fromCharCode(...chunk.subarray(i, i + 0x8000));
  return btoa(binary);
}
function playLivePcm(base64) {
  if (!liveContext || !base64) return;
  const raw = atob(base64);
  const count = Math.floor(raw.length / 2);
  if (!count) return;
  const samples = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    let value = raw.charCodeAt(i * 2) | (raw.charCodeAt(i * 2 + 1) << 8);
    if (value >= 32768) value -= 65536;
    samples[i] = value / 32768;
  }
  const buffer = liveContext.createBuffer(1, count, 24000);
  buffer.copyToChannel(samples, 0);
  const source = liveContext.createBufferSource();
  source.buffer = buffer;
  source.connect(liveContext.destination);
  const startAt = Math.max(liveContext.currentTime + 0.025, playbackCursor);
  playbackCursor = startAt + buffer.duration;
  playbackSources.add(source);
  source.onended = () => {
    playbackSources.delete(source);
    if (playbackSources.size === 0 && liveReady && voice.classList.contains('on')) setVoice('listening');
  };
  source.start(startAt);
  setVoice('speaking');
}
function saveLiveTurn() {

}
async function startLiveSession() {
  let attemptId = liveAttemptId;
  try {
    // Keep every startup guard inside this try block so Safari always shows the
    // actual failure instead of leaving an unhandled rejected click promise.
    if (liveSocket) throw new Error('A voice connection is already open. Tap the microphone once to stop it.');
    if (vstate !== 'idle') throw new Error('Voice was busy (' + vstate + '). The session has been reset; tap the microphone again.');
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Safari did not expose microphone access. Open this page directly in Safari and check Microphone permissions.');
    if (!window.isSecureContext) throw new Error('Microphone access requires a secure HTTPS page.');
    attemptId = ++liveAttemptId;
    liveUserText = '';
    liveAssistantText = '';
    vErr = '';
    setVoice('thinking');
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error('Audio is not supported in this browser.');
    liveContext = new AudioContextClass();
    // Invoke both browser permission/audio-unlock APIs directly inside the mic tap,
    // before awaiting either one (important for iOS Safari user-activation rules).
    $('#vst').textContent = 'Allow microphone access';
    $('#vhint').textContent = 'Waiting for iPhone microphone permission…';
    const audioResume = liveContext.resume();
    // Attach a handler immediately; we still await the original promise below.
    audioResume.catch(() => {});
    const microphoneRequest = navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    let micTimedOut = false;
    let micTimerId;
    const micTimeout = new Promise((resolve, reject) => {
      micTimerId = setTimeout(() => {
        micTimedOut = true;
        reject(new Error('Microphone permission timed out. On iPhone, open Settings > Safari > Microphone, allow access, then reload this page.'));
      }, 15000);
    });
    // If Safari grants permission after the timeout, immediately release the late stream.
    microphoneRequest.then(stream => {
      if (micTimedOut || attemptId !== liveAttemptId) stream.getTracks().forEach(track => track.stop());
    }).catch(() => {});
    liveStream = await Promise.race([microphoneRequest, micTimeout]);
    clearTimeout(micTimerId);
    if (attemptId !== liveAttemptId) { liveStream.getTracks().forEach(track => track.stop()); liveStream = null; return; }
    $('#vst').textContent = 'Connecting to Gemini';
    $('#vhint').textContent = 'Microphone ready. Opening live voice connection…';
    await audioResume;
    if (attemptId !== liveAttemptId) return;
    const wsUrl = new URL(HAMASA_CONFIG.voiceUrl);
    wsUrl.protocol = wsUrl.protocol === 'https:' ? 'wss:' : 'ws:';
    wsUrl.searchParams.set('gender', voiceGender);
    liveSetupDone = false;
    const setupComplete = new Promise((resolve, reject) => {
      liveSetupResolve = () => { liveSetupDone = true; clearTimeout(liveSetupTimer); resolve(); };
      liveSetupReject = error => { clearTimeout(liveSetupTimer); reject(error); };
      liveSetupTimer = setTimeout(() => liveSetupReject(new Error('Gemini did not confirm the voice session. Check the Gemini Live API key and model access.')), 25000);
    });
    setupComplete.catch(() => {});
    liveSocket = new WebSocket(wsUrl.toString());
    liveSocket.onmessage = event => {
      let packet;
      try { packet = JSON.parse(event.data); } catch { return; }
      if (packet.error) {
        const message = String(packet.error);
        vErr = message;
        if (!liveSetupDone && liveSetupReject) {
          liveSetupReject(new Error(message));
          return;
        }
        stopLiveSession();
        setVoice('idle');
        $('#vhint').textContent = 'فشل اتصال Gemini Live: ' + message;
        return;
      }
      if (packet.setupComplete) {
        liveReady = true;
        if (!liveSetupDone && liveSetupResolve) liveSetupResolve();
        setVoice('listening');
        return;
      }
      const content = packet.serverContent || {};
      if (content.interrupted) {
        stopPlayback();
        setVoice('listening');
      }
      if (content.inputTranscription?.text) {
        liveUserText += content.inputTranscription.text;
        $('#vcap').textContent = liveUserText;
      }
      if (content.outputTranscription?.text) {
        liveAssistantText += content.outputTranscription.text;
        $('#vcap').textContent = liveAssistantText;
      }
      for (const part of (content.modelTurn?.parts || [])) {
        const audio = part.inlineData?.data || part.inline_data?.data;
        if (audio) playLivePcm(audio);
      }
      if (content.turnComplete) {
        saveLiveTurn();
        if (playbackSources.size === 0) setVoice('listening');
      }
    };
    liveSocket.onerror = () => { vErr = t('errB'); };
    liveSocket.onclose = event => {
      liveReady = false;
      // A user-requested stop is a normal close, not a connection failure.
      if (event.code === 1000 && event.reason === 'Voice session ended') return;
      const reason = event.reason ? ' — ' + event.reason : '';
      if (!liveSetupDone && liveSetupReject) liveSetupReject(new Error('Gemini Live connection closed (' + event.code + ')' + reason));
      if (voice.classList.contains('on')) {
        if (!vErr) vErr = 'Voice connection closed (' + event.code + ')' + reason;
        setVoice('idle');
      }
    };
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('Gemini Live connection timed out.')), 18000);
      liveSocket.addEventListener('open', () => { clearTimeout(timeout); resolve(); }, { once: true });
      liveSocket.addEventListener('error', () => { clearTimeout(timeout); reject(new Error('Could not open Gemini Live connection.')); }, { once: true });
    });
    $('#vst').textContent = 'Waiting for Gemini';
    $('#vhint').textContent = 'Connected to server. Waiting for Gemini Live to confirm…';
    // Setup acknowledgement is captured by onmessage from the moment the socket is created,
    // so a fast Gemini setupComplete frame can never be missed.
    await setupComplete;
    if (attemptId !== liveAttemptId || !liveContext || !liveStream) return;
    const source = liveContext.createMediaStreamSource(liveStream);
    liveProcessor = liveContext.createScriptProcessor(4096, 1, 1);
    silentGain = liveContext.createGain();
    silentGain.gain.value = 0;
    liveProcessor.onaudioprocess = event => {
      if (!liveReady || !liveSocket || liveSocket.readyState !== WebSocket.OPEN || liveSocket.bufferedAmount > 900000) return;
      const pcm = downsampleTo16k(event.inputBuffer.getChannelData(0), liveContext.sampleRate);
      liveSocket.send(JSON.stringify({
        realtimeInput: { audio: { mimeType: 'audio/pcm;rate=16000', data: pcmBase64(pcm) } }
      }));
    };
    source.connect(liveProcessor);
    liveProcessor.connect(silentGain);
    silentGain.connect(liveContext.destination);
    liveSource = source;
    setVoice('listening');
  } catch (error) {
    // A stopped/older attempt must never tear down a newer session or overwrite
    // the state chosen by the user.
    if (attemptId !== liveAttemptId) return;
    console.error('HAMASA Live voice:', error);
    vErr = error?.message || t('micDenied');
    stopLiveSession();
    setVoice('idle');
    $('#vhint').textContent = 'تعذر تشغيل المحادثة المباشرة: ' + vErr;
  }
}

const micButton = $('#mic');
let micLastActivation = 0;
async async function activateLiveMic(event) {
  const now = Date.now();
  if (now - micLastActivation < 450) return;
  micLastActivation = now;
  event?.preventDefault?.();
  event?.stopPropagation?.();
  if (liveSocket || liveStream || vstate !== 'idle') {
    stopLiveSession();
    vErr = '';
    setVoice('idle');
    micButton.disabled = false;
    return;
  }
  // Give immediate, visible feedback on iOS before any permission/network await.
  vErr = '';
  // Do not change vstate here: startLiveSession() requires the idle state
  // to pass its own re-entry guard, then sets the thinking state itself.
  $('#vst').textContent = 'Starting…';
  $('#vhint').textContent = 'Starting live microphone…';
  micButton.disabled = true;
  try {
    await startLiveSession();
  } finally {
    micButton.disabled = false;
  }
}
micButton.type = 'button';
// Use one activation event only. iOS Safari synthesizes click after pointerup;
// listening to both can race the Live state transition.
micButton.addEventListener('click', activateLiveMic);
/* INIT */
mountOrbs(); applyTheme(); applyLang(); renderChat(); checkBackend();
</script>
</body>
